<nav class="mt-5">
  <ul class="pagination justify-content-center">
    {% if projects.has_previous %}
      <li class="page-item">
        <a class="page-link" href="?page=1{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}">&laquo; First</a>
      </li>
      <li class="page-item">
        <a class="page-link" href="?page={{ projects.previous_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}">Previous</a>
      </li>
    {% endif %}

    <li class="page-item disabled">
      <span class="page-link">
        Page {{ projects.number }} of {{ projects.paginator.num_pages }}
      </span>
    </li>

    {% if projects.has_next %}
      <li class="page-item">
        <a class="page-link" href="?page={{ projects.next_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}">Next</a>
      </li>
      <li class="page-item">
        <a class="page-link" href="?page={{ projects.paginator.num_pages }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}">Last &raquo;</a>
      </li>
    {% endif %}
  </ul>
</nav
